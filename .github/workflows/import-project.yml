name: Import project source

on:
  push:
    paths:
      - ".project-upload/chunk-*"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and extract project
        shell: bash
        run: |
          shopt -s nullglob
          chunks=(.project-upload/chunk-*)
          if [ ${#chunks[@]} -eq 0 ]; then
            echo "No upload chunks present; nothing to do."
            exit 0
          fi
          cat "${chunks[@]}" > /tmp/project-src.tar.xz
          xz -t /tmp/project-src.tar.xz
          tar -xJf /tmp/project-src.tar.xz
          rm -rf .project-upload

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: import complete SaaS source"
          git push
